[project]
name = "local-gov-research-agent"
version = "0.1.0"
description = "Agent for analyzing local government website compliance with transparency criteria"
requires-python = ">=3.13"
dependencies = [
    "crawl4ai[all]>=0.5.0.post8",
    "pydantic>=2.0.0",
    "python-dotenv>=0.21.0",
    "pytz>=2025.2",
]

[dependency-groups]
dev = [
    "black>=23.1.0",
    "isort>=5.12.0",
    "mypy>=1.0.1",
    "ruff>=0.0.54",
    "pytest>=7.2.2",
]
